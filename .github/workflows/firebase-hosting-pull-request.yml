# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
'on': pull_request

env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_USERNAME: DeployBot
  SLACK_CHANNEL: fukke-cafe

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Smoke check build artifacts
        run: |
          set -e
          for f in public/index.html public/tech/index.html public/404.html public/sitemap-index.xml; do
            if [ ! -s "$f" ]; then
              echo "missing or empty: $f" >&2
              exit 1
            fi
          done
          count=$(find public -type d -path 'public/tech/*' | wc -l | tr -d ' ')
          if [ "$count" -lt 10 ]; then
            echo "expected at least 10 tech article pages, got $count" >&2
            exit 1
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUKKE_PROGRAMMING_NIKKI }}'
          projectId: fukke-programming-nikki

  success_notification:
    needs: build_and_preview
    name: Slack Notification Success
    runs-on: ubuntu-latest
    if: success()
    steps:
    - uses: actions/checkout@v4
    - name: Slack Notification
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_TITLE: Deploy Success
        SLACK_COLOR: good

  failed_notification:
    needs: build_and_preview
    name: Slack Notification Success
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - uses: actions/checkout@v4
    - name: Slack Notification
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_TITLE: Deploy Failure
        SLACK_COLOR: danger
